<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1f2328" flood-opacity="0.14"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1f2328" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="panelGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="0.55" stop-color="#1a7f37"/>
      <stop offset="1" stop-color="#bf3989"/>
    </linearGradient>
    
  </defs>
  <rect width="1280" height="800" fill="#f6f8fa"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

    
    <rect x="0" y="0" width="1280" height="56" fill="#ffffff"/>
    <circle cx="24" cy="28" r="6" fill="#ff5f57"/>
    <circle cx="44" cy="28" r="6" fill="#ffbd2e"/>
    <circle cx="64" cy="28" r="6" fill="#28c840"/>
    <rect x="96" y="14" width="820" height="28" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="122" y="33" font-size="13" fill="#57606a">github.com/example/repo/pull/42/files</text>
    <rect x="0" y="56" width="1280" height="54" fill="#24292f"/>
    <text x="42" y="90" font-size="18" font-weight="700" fill="#ffffff">example / repo</text>
    <rect x="520" y="73" width="118" height="24" rx="12" fill="#2da44e"/>
    <text x="544" y="90" font-size="13" font-weight="700" fill="#ffffff">Open PR</text>
    <text x="42" y="150" font-size="26" font-weight="700" fill="#1f2328">Pull request #42</text>
    <rect x="41" y="164" width="144" height="2" fill="#fd8c73"/>
    <text x="42" y="190" font-size="14" font-weight="700" fill="#1f2328">Options</text>
    <text x="166" y="190" font-size="14" fill="#57606a">Commits</text>
    <text x="248" y="190" font-size="14" fill="#57606a">Checks</text>
  
    <rect x="238" y="172" width="804" height="536" rx="12" fill="#ffffff" stroke="#d0d7de" filter="url(#shadow)"/>
    <text x="294" y="238" font-size="28" font-weight="700" fill="#1f2328">PR File Explorer Enhancer</text>
    <text x="294" y="270" font-size="15" fill="#57606a">Quality-of-life controls for GitHub pull request files pages.</text>
    <rect x="294" y="318" width="692" height="290" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="326" y="366" font-size="18" font-weight="700" fill="#1f2328">Editor command (optional)</text>
    <text x="326" y="394" font-size="14" fill="#57606a">Copy a cursor -g or code -g command for the current file and line.</text>
    <circle cx="338" cy="446" r="10" fill="#1a7f37"/>
    <text x="362" y="451" font-size="14" fill="#1f2328">Enable editor command icon</text>
    <text x="326" y="502" font-size="14" font-weight="700" fill="#1f2328">Editor</text>
    <rect x="414" y="480" width="220" height="36" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="432" y="503" font-size="14" fill="#1f2328">cursor</text>
    <text x="326" y="562" font-size="14" font-weight="700" fill="#1f2328">Local repository root</text>
    <rect x="326" y="578" width="500" height="38" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="344" y="602" font-size="14" fill="#57606a">~/Projects/repo</text>
    <rect x="840" y="578" width="92" height="38" rx="6" fill="#0969da"/>
    <text x="870" y="602" font-size="14" font-weight="700" fill="#ffffff">Save</text>
    <text x="52" y="764" font-size="20" font-weight="700" fill="#1f2328">Optional editor command settings stay local in Chrome storage.</text>
  
  </g>
</svg>
